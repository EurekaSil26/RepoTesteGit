<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>

    <h1>Login</h1>

    <form>
        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="senha">Password:</label><br>
        <input type="password" id="senha" name="senha" required>

        <br><br>

        <button type="submit">To Enter</button>
    </form>

    <p>
        <a href="#">I dont remember my password</a>
    </p>

    <p>
        No have a account ? <a href="#">Criar conta</a>
    </p>

</body>
</html>
